<text x="360" y="28" text-anchor="middle" font-family="Noto Sans TC,sans-serif" font-size="15" font-weight="700" fill="#0f766e">Deep Research 流程</text>
<g font-family="Noto Sans TC,sans-serif" font-size="12">
<rect x="20" y="55" width="120" height="90" rx="12" fill="#e8f0fe" stroke="#1967d2"/><text x="80" y="95" text-anchor="middle" fill="#1967d2" font-weight="700">① 寫 brief</text><text x="80" y="118" text-anchor="middle" fill="#4a4a5a" font-size="11">範圍·時間·來源</text>
